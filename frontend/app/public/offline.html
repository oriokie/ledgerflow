<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LedgerFlow — Offline</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0c10;
        color: #e9eaf2;
        text-align: center;
        padding: 24px;
      }
      .wrap { max-width: 360px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #9aa0b4; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #5f62dd;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 15px;
        min-height: 44px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>
        LedgerFlow needs a connection to load your accounts. Anything queued in Quick Add will
        send automatically once you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
