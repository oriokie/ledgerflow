[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP", "SIM"]
ignore = ["E501"]  # line length handled by formatter, not worth failing CI over

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.black]
line-length = 110
target-version = ["py312"]
extend-exclude = "/migrations/"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/apps.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
