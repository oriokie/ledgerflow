# Production-*like* local testing only — real deployments should use a
# managed Postgres/Redis and an orchestrator (ECS/K8s), not this file, but
# `docker compose -f docker-compose.prod.yml up` is useful for a final sanity
# check before shipping: no bind-mounted source, real gunicorn, migrations
# gated behind an explicit flag rather than always-on.
#
# All secrets are expected to come from the real environment (or a secrets
# manager), never from this file.

services:
  web:
    build:
      context: .
      args: {REQUIREMENTS_FILE: requirements/production.txt}
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      RUN_MIGRATIONS: "true"
      COLLECT_STATIC: "true"
    env_file: .env
    ports: ["8000:8000"]
    restart: unless-stopped

  worker:
    build:
      context: .
      args: {REQUIREMENTS_FILE: requirements/production.txt}
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    env_file: .env
    restart: unless-stopped

  beat:
    build:
      context: .
      args: {REQUIREMENTS_FILE: requirements/production.txt}
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    env_file: .env
    restart: unless-stopped
