# Self-contained single-server production stack, driven by deploy/provision.sh.
#
# Unlike docker-compose.prod.yml (a bare web/worker/beat for a local prod-like
# sanity check), this file is a complete, runnable server deployment: it adds
# Postgres, Redis, and a Caddy reverse proxy that auto-provisions Let's Encrypt
# TLS. Every secret comes from the generated .env (never hard-coded here).
#
# Scaling past one box: point DATABASE_URL/REDIS_URL at managed services and
# drop the db/redis services, or move to an orchestrator. The app services are
# stateless and scale horizontally as-is.

x-app-build: &app-build
  build:
    context: ..
    args: {REQUIREMENTS_FILE: requirements/production.txt}
  env_file: ../.env
  restart: unless-stopped
  depends_on:
    # `required: false` skips the dependency when the bundled-db profile is
    # off (external database) instead of refusing to start the stack.
    db: {condition: service_healthy, required: false}
    redis: {condition: service_healthy}

services:
  db:
    image: postgres:16-alpine
    # Behind a profile so `setup.sh` can point DATABASE_URL at a managed
    # Postgres instead — without this file insisting on running its own.
    profiles: ["bundled-db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerflow}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    ports:
      # Loopback only, and deliberately so. The bundled database is otherwise
      # reachable only from inside the compose network, which makes routine
      # work — psql, a dump, pointing a desktop client at it — impossible
      # without `docker exec` gymnastics. 127.0.0.1 keeps it off every
      # external interface: from a laptop it needs an SSH tunnel
      #   ssh -L 5432:127.0.0.1:5432 you@server
      # which authenticates as the server does, rather than exposing Postgres
      # to the internet with only its password in the way.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes: ["redisdata:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app-build
    # entrypoint.sh runs migrations + collectstatic before gunicorn starts
    environment:
      RUN_MIGRATIONS: "true"
      COLLECT_STATIC: "true"
    command:
      ["gunicorn", "config.wsgi:application",
       "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "30",
       "--access-logfile", "-", "--error-logfile", "-"]
    # Readiness, not liveness: this decides whether the container is fit to
    # receive traffic. Liveness (/healthz) checks nothing external on purpose —
    # a database outage must not make Docker restart every replica at once.
    # start_period covers migrations + collectstatic in entrypoint.sh.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz/', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 60s
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    expose: ["8000"]

  worker:
    <<: *app-build
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4"]
    volumes:
      - media:/app/media

  beat:
    <<: *app-build
    # exactly one beat scheduler per deployment (see docs/DEPLOYMENT.md)
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  caddy:
    image: caddy:2-alpine
    # Behind a profile: with nginx or Apache terminating TLS on the host,
    # starting Caddy too would mean two servers binding 80/443 and one of them
    # failing in a way that looks like a certificate problem.
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env}
    volumes:
      # :z relabels the host file for the container's SELinux context. A
      # no-op where SELinux isn't in play (Debian/Ubuntu); required on the
      # RHEL family with SELinux enforcing (the common default there), or
      # Caddy gets "permission denied" reading a file that is right there.
      # Named volumes below don't need it — Docker manages their context.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - staticfiles:/srv/staticfiles:ro
      - frontend:/srv/frontend:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - frontend

  caddy_internal:
    # The plain-HTTP twin of `caddy`, for deployments where nginx, Apache or an
    # upstream load balancer terminates TLS on the host. It exists because the
    # host web server used to proxy straight to gunicorn — which has no
    # published port and no idea the SPA exists, so nginx and Apache setups
    # got connection-refused, and would have got a JSON 404 for the app even
    # with a port. All path routing stays in one Caddyfile per deployment.
    image: caddy:2-alpine
    profiles: ["internal"]
    restart: unless-stopped
    environment:
      # Caddyfile.internal pins the upstream Host header to this, so Django
      # sees the public hostname no matter what the front end did to it.
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    ports:
      # Loopback only: the host web server is the only intended client, and
      # binding wider would expose the app with TLS and HSTS assumptions unmet.
      # The port is configurable because 8080 is popular on a busy box, and a
      # clash here otherwise surfaces as a failed bind after everything else
      # has already started.
      - "127.0.0.1:${INTERNAL_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro,z
      - staticfiles:/srv/staticfiles:ro
      - frontend:/srv/frontend:ro
    depends_on:
      - web
      - frontend

  frontend:
    # Builds the SPA to static files and publishes them into the shared
    # `frontend` volume that Caddy serves. Exits/idles after publishing; the
    # assets persist in the volume. Rebuild with `up -d --build frontend` to
    # ship a new frontend version.
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    volumes:
      - frontend:/srv/frontend
    restart: "no"

  pgweb:
    # Browse the database in a browser: tables, rows, ad-hoc SQL, CSV export.
    # Behind a profile because it is a debugging convenience, not part of the
    # application — `--profile pgweb` turns it on, and leaving it off is the
    # right default for a box nobody is actively inspecting.
    image: sosedoff/pgweb:latest
    profiles: ["pgweb"]
    restart: unless-stopped
    environment:
      # Same credentials the app uses; pgweb is a viewer, not a second account.
      PGWEB_DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
    ports:
      # Loopback only. pgweb has no authentication of its own — anyone who can
      # reach the port has full read/write SQL access — so the SSH tunnel is
      # the authentication:
      #   ssh -L 8081:127.0.0.1:8081 you@server   then open localhost:8081
      # Never publish this on 0.0.0.0 or proxy it from a public vhost.
      - "127.0.0.1:${PGWEB_HOST_PORT:-8081}:8081"
    depends_on:
      db: {condition: service_healthy, required: false}

volumes:
  pgdata:
  redisdata:
  staticfiles:
  media:
  frontend:
  caddydata:
  caddyconfig:
