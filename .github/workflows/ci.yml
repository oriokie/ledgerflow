name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-secret-key
  DATABASE_URL: postgres://ledgerflow:ledgerflow@localhost:5432/ledgerflow
  REDIS_URL: redis://localhost:6379/0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements/development.txt
      - run: ruff check apps config tests manage.py
      - run: black --check apps config tests manage.py

      # Design-system guards. Both are stdlib-only and need no browser, so
      # they belong in the fast job rather than gating on the test matrix.
      - name: Palette contrast and colour-vision floors
        run: python scripts/verify_palette.py
      - name: Design-token drift (ratchet)
        run: python scripts/check_style_tokens.py

  # The frontend had no CI at all: 644 tests, a typecheck and a linter, none of
  # which gated anything. A suite nobody runs is documentation, not a test.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci
      # `tsc --noEmit` here would be a no-op: the root tsconfig has `files: []`
      # and only project references, so without `-b` it checks zero files and
      # always exits 0. Ran that way for several phases before it was noticed.
      - name: Typecheck
        run: npm run typecheck
      # `tsconfig.app.json` excludes test files, so `tsc -b` never saw them and
      # the `typecheck:test` script nothing ran had drifted into failure: four
      # goal fixtures were missing fields that `SavingsGoal` had since gained.
      # An untyped fixture silently stops testing what it claims to.
      - name: Typecheck tests
        run: npm run typecheck:test
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerflow
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: ledgerflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    # POSTGRES_USER is a superuser — that is how the postgres image builds it —
    # and superusers bypass row-level security unconditionally. Running the
    # suite as one silently disabled the entire tenant-isolation mechanism the
    # RLS tests exist to prove, so they asserted nothing and still went green.
    # Everything below therefore connects as an ordinary role instead.
    env:
      DATABASE_URL: postgres://ledgerflow_app:ledgerflow_app@localhost:5432/ledgerflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements/test.txt

      # The receipt OCR tests exercise the real tesseract binary rather than a
      # stub, so the package is a genuine test dependency; without it they fail
      # on an empty transcription rather than skipping.
      - name: Install tesseract (receipt OCR)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Create the unprivileged application role
        run: |
          PGPASSWORD=ledgerflow psql -h localhost -U ledgerflow -d ledgerflow <<'SQL'
            -- NOSUPERUSER/NOBYPASSRLS are the point: they are what makes the
            -- RLS policies actually apply. CREATEDB only so pytest-django can
            -- create and drop the test database it owns.
            CREATE ROLE ledgerflow_app LOGIN PASSWORD 'ledgerflow_app'
              NOSUPERUSER NOBYPASSRLS NOCREATEROLE CREATEDB;
            GRANT ALL ON SCHEMA public TO ledgerflow_app;
          SQL

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest --cov-fail-under=70

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # Browser-measured assertions that jsdom cannot make: text overlap, rendered
  # font sizes, touch-target geometry, horizontal overflow. Needs the whole
  # stack up and a seeded workspace, so it runs after `test` rather than
  # blocking the fast feedback.
  route-audit:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerflow
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: ledgerflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - run: pip install -r requirements/development.txt
      - run: python -m playwright install --with-deps chromium

      # The audit is a ratchet, so the workspace it measures has to be the same
      # workspace every run. It was not: the seeder keys its RNG on the
      # tenant's id (a fresh UUID per run) and backfills from January 1st (a
      # window that grows daily), so the rendered page differed every time and
      # the counts wandered — 66, 67, 69, 70 for one unchanged commit. A fixed
      # seed and a fixed-length window make the measurement reproducible.
      - name: Migrate and seed a workspace to measure
        run: |
          python manage.py migrate
          python manage.py seed_platform_demo
          python manage.py seed_tenant_demo \
            --seed route-audit \
            --from "$(date -u -d '90 days ago' +%F)"

      - name: Start the stack
        run: |
          python manage.py runserver 0.0.0.0:8000 --noreload &
          npm --prefix frontend/app ci
          npm --prefix frontend/app run dev &
          npx --yes wait-on http://localhost:8000/healthz/ http://localhost:5173 --timeout 120000

      - name: Route audit (ratchet)
        run: python scripts/audit_routes.py

      - name: Show every finding on failure
        if: failure()
        run: python scripts/audit_routes.py --list || true

  # Builds the two images the server runs. On main they are published to GHCR
  # tagged with the commit SHA; on a pull request the same build runs and is
  # thrown away, which keeps the Dockerfile honest without publishing anything.
  #
  # The server used to build these itself. That box also hosts eight other
  # production sites, so every deploy compiled the SPA and installed Python
  # dependencies in competition with somebody else's live traffic. Building
  # once here means a deploy is a pull, and the artifact that ran through the
  # test suite is byte-for-byte the artifact that serves requests.
  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          build-args: REQUIREMENTS_FILE=requirements/production.txt
          tags: ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          build-args: VITE_API_BASE_URL=/api/v1
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Promotion, not a build: it moves the `:released` tag onto images that have
  # already passed everything. The server follows that tag and nothing else, so
  # this job is the only thing that can change what production runs.
  #
  # `environment: production` is where the approval gate lives — add yourself as
  # a required reviewer under Settings -> Environments -> production and every
  # promotion waits for a click. Without that configuration this still works,
  # it just does not pause.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, route-audit]
    environment: production
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # imagetools retags in the registry without pulling either image down.
      - name: Promote this commit to :released
        run: |
          for name in app frontend; do
            docker buildx imagetools create \
              --tag "ghcr.io/${{ github.repository }}/$name:released" \
              "ghcr.io/${{ github.repository }}/$name:${{ github.sha }}"
          done
